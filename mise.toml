# Repo tasks — `mise tasks` to list, `mise run <task>` to run.

# Per-user telemetry identity (placeholder slug = local username for now).
# The rest of the telemetry env is project-scoped in .claude/settings.json;
# this one is per-person, so it lives here where it can be templated.
[env]
OTEL_RESOURCE_ATTRIBUTES = "user.slug={{env.USER}}"

[tasks.validate]
description = "Validate marketplace + plugin manifests"
run = "claude plugin validate ."

[tasks."dist:build"]
description = "Rebuild portable skills (dist/agents/skills) from plugins/"
run = "python3 tools/build-dist.py"

[tasks."dist:install"]
description = "Symlink portable skills into ~/.agents/skills (OpenCode + Codex)"
depends = ["dist:build"]
run = "tools/install-skills.sh"

# ── telemetry lab ────────────────────────────────────────────────────

[tasks."lab:up"]
description = "Start the telemetry lab (colima + collector + dashboard)"
run = """
colima status >/dev/null 2>&1 || colima start
docker compose -f telemetry-lab/docker-compose.yml up -d
echo "dashboard → http://localhost:3000"
"""

[tasks."lab:down"]
description = "Stop the telemetry lab"
run = "docker compose -f telemetry-lab/docker-compose.yml down"

[tasks."lab:status"]
description = "Show lab containers and endpoint health"
run = """
docker compose -f telemetry-lab/docker-compose.yml ps
curl -s -o /dev/null -w 'collector /metrics: %{http_code}\\n' localhost:8889/metrics
curl -s -o /dev/null -w 'dashboard:         %{http_code}\\n' localhost:3000/
"""

[tasks."lab:logs"]
description = "Tail collector logs (events land here when OTEL_LOGS_EXPORTER=otlp)"
run = "docker compose -f telemetry-lab/docker-compose.yml logs -f otel-collector"

[tasks."lab:metrics"]
description = "Dump claude_code series currently held by the collector"
run = "curl -s localhost:3000/metrics | grep '^claude_code' || echo 'no claude_code series yet — run lab:ping or lab:session first'"

[tasks."lab:session"]
description = "Interactive Claude session wired to the lab collector (posture A env)"
env = { CLAUDE_CODE_ENABLE_TELEMETRY = "1", OTEL_METRICS_EXPORTER = "otlp", OTEL_EXPORTER_OTLP_PROTOCOL = "grpc", OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317", OTEL_LOG_TOOL_DETAILS = "1", OTEL_METRIC_EXPORT_INTERVAL = "3000" }
run = "claude"

[tasks."lab:ping"]
description = "One-shot: install team-a, fire its ping skill, show skill-attributed metrics"
env = { CLAUDE_CODE_ENABLE_TELEMETRY = "1", OTEL_METRICS_EXPORTER = "otlp", OTEL_EXPORTER_OTLP_PROTOCOL = "grpc", OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317", OTEL_LOG_TOOL_DETAILS = "1", OTEL_METRIC_EXPORT_INTERVAL = "3000" }
run = """
claude plugin marketplace add ./ >/dev/null 2>&1 || true
claude plugin install team-a@acme >/dev/null 2>&1 || true
claude -p "ping team-a"
sleep 6
echo "--- skill-attributed series (skill_name=\\"third-party\\" is expected: metrics bucket third-party names; see lab:trace for verbatim) ---"
curl -s localhost:3000/metrics | grep -o 'skill_name="[^"]*"' | sort | uniq -c
"""

[tasks."lab:trace"]
description = "Fire the ping skill with the tracing beta — verbatim skill_name on tool spans"
env = { CLAUDE_CODE_ENABLE_TELEMETRY = "1", CLAUDE_CODE_ENHANCED_TELEMETRY_BETA = "1", OTEL_METRICS_EXPORTER = "otlp", OTEL_TRACES_EXPORTER = "otlp", OTEL_EXPORTER_OTLP_PROTOCOL = "grpc", OTEL_EXPORTER_OTLP_ENDPOINT = "http://localhost:4317", OTEL_LOG_TOOL_DETAILS = "1", OTEL_TRACES_EXPORT_INTERVAL = "2000" }
run = """
claude plugin marketplace add ./ >/dev/null 2>&1 || true
claude plugin install team-a@acme >/dev/null 2>&1 || true
claude -p "ping team-a"
sleep 6
echo "--- tool spans (expect tool_name=Skill skill_name=team-a:ping) ---"
docker logs telemetry-lab-otel-collector-1 --since 2m 2>&1 | grep 'span.type=tool ' | tail -3
"""
